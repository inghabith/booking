[project]
name = "resources-service"
version = "0.1.0"
description = "Definición de recursos reservables: características y disponibilidad"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi[standard]>=0.121.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
